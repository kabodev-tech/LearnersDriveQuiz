        // START QUIZ
        function startQuiz() {
            currentQuestion = 0;
            selectedAnswers = [];
            timer = 10 * 60; // 8 minute for quiz
            timeEl.innerText = timer;
            shuffleArray(questions);
            updateTimerColor();
            updateProgressBarColor();
            startTimer();
            showQuestion();
        }

        // TIMER
        function startTimer() {
            clearInterval(countdown);
            countdown = setInterval(() => {
                if (timer <= 0) {
                    clearInterval(countdown);
                    showResults();
                    return;
                }

                timer--;
                timeEl.innerText = timer;
                updateTimerColor();
                updateProgressBarColor();
            }, 1000);
        }

        // SHOW QUESTION
        function showQuestion() {
            const q = questions[currentQuestion];
            const progress =
                ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById("progressBar").style.width = progress + "%";

            app.innerHTML = `
        <div class="question-count">
          Question ${currentQuestion + 1} of ${questions.length}
        </div>

        <h2>${q.level}</h2>

        ${q.image ? `<img src="${q.image}" class="quiz-image">` : ""}

        <div class="question">${q.question}</div>

        <div class="options">
          ${q.options.map((option, index) => `
            <div class="option ${selectedAnswers[currentQuestion] === index ? 'selected' : ''}" 
                 onclick="selectOption(${index})">
              ${option}
            </div>
          `).join("")}
        </div>

        <div class="btn-group">
          ${currentQuestion > 0 ? `
            <button class="secondary" onclick="prevQuestion()">
              Previous
            </button>
          ` : ""}

          <button class="primary" onclick="nextQuestion()">
            ${currentQuestion === questions.length - 1 ? "Finish Quiz" : "Next"}
          </button>
        </div>
      `;
        }

        // SELECT OPTION
        function selectOption(index) {
            selectedAnswers[currentQuestion] = index;
            showQuestion();
        }

        // NEXT QUESTION
        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                showQuestion();
            } else {
                showResults();
            }
        }

        // PREVIOUS QUESTION
        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion();
            }
        }

        // SHOW RESULTS
        function showResults() {
            clearInterval(countdown);

            score = 0;
            questions.forEach((q, index) => {
                if (selectedAnswers[index] === q.answer) {
                    score++;
                }
            });
            const percentage = Math.round((score / questions.length) * 100);
            localStorage.setItem("highScore", percentage);

            let status = "";

            if (percentage < 50) {
                status = "Fail";
            } else if (percentage < 80) {
                status = "Pass";
            } else {
                status = "Excellent";
            }

            app.innerHTML = `
        <div class="result-box">

          <h1>Quiz Completed</h1>

          <div class="score">${percentage}%</div>

          <div class="status">${status}</div>

          <p>
            You answered ${score} out of ${questions.length} questions correctly.
          </p>

          <div class="btn-group">
            <button class="primary" onclick="restartQuiz()">
              Try Again
            </button>

            <button class="secondary" onclick="reviewAnswers()">
              Preview Results
            </button>

            <button class="secondary" onclick="exitQuiz()">
              Exit
            </button>
          </div>

        </div>
      `;
        }

        // REVIEW ANSWERS
        function reviewAnswers() {
            app.innerHTML = `
        <h1>Quiz Review</h1>

        ${questions.map((q, index) => `
          <div class="review-item">

            <h3>
              ${index + 1}. ${q.question}
            </h3>

            <p>
              Your Answer:
              <span class="${selectedAnswers[index] === q.answer ? 'correct' : 'wrong'}">
                ${selectedAnswers[index] !== undefined
                    ? q.options[selectedAnswers[index]]
                    : "No Answer"}
              </span>
            </p>

            <p class="correct">
              Correct Answer: ${q.options[q.answer]}
            </p>

          </div>
        `).join("")}

        <div class="btn-group">
          <button class="primary" onclick="showResults()">
            Back To Results
          </button>
        </div>
      `;
        }

        // RESTART QUIZ
        function restartQuiz() {
            currentQuestion = 0;
            selectedAnswers = [];
            score = 0;
            timer = 8 * 60; // 8 minute for retake
            timeEl.innerText = timer;
            startQuiz();
        }

        // EXIT QUIZ
        function exitQuiz() {
            // location.reload();
            window.location.href = "index.html";

        }

        function toggleTheme() {
            document.body.classList.toggle("theme-dark");
        }

        // INIT
        showIntro();
</script>

</body>

</html>
